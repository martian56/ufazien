      - category
      - category_name
      - comments
      - content
      - featured_image_url
      - id
      - is_bookmarked
      - is_liked
      - likes_count
      - published_at
      - read_time
      - tags
      - title
      - updated_at
      - views
    CalculationTypeEnum:
      enum:
      - semester
      - yearly
      type: string
      description: |-
        * `semester` - Semester-based
        * `yearly` - Yearly Average
    Category:
