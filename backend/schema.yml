components:
  schemas:
    AcademicYear:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 10
        description:
          type: string
          maxLength: 100
        order:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
      required:
      - id
      - name
      - order
    AverageSchema:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 100
        description:
          type: string
          nullable: true
        creator:
          type: integer
          readOnly: true
        creator_full_name:
          type: string
          readOnly: true
        creator_username:
          type: string
          readOnly: true
        is_public:
          type: boolean
        is_saved_by_user:
          type: string
          readOnly: true
        usage_count:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        fields:
          type: array
          items:
            $ref: '#/components/schemas/SchemaField'
          readOnly: true
      required:
      - created_at
      - creator
      - creator_full_name
      - creator_username
      - fields
      - id
      - is_saved_by_user
      - name
      - updated_at
      - usage_count
    BlogPost:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 255
        content:
          type: string
        excerpt:
          type: string
          maxLength: 300
        featured_image:
          type: string
          format: uri
          nullable: true
        featured_image_url:
          type: string
          readOnly: true
        author:
          allOf:
          - $ref: '#/components/schemas/User'
          readOnly: true
        category:
          type: integer
        category_name:
          type: string
          readOnly: true
        tag_names:
          type: array
          items:
            type: string
          writeOnly: true
        tags:
          type: string
          readOnly: true
        published_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        read_time:
          type: string
          maxLength: 20
        likes_count:
          type: string
          readOnly: true
        comments:
          type: string
          readOnly: true
        views:
          type: integer
          readOnly: true
        is_liked:
          type: string
          readOnly: true
        is_bookmarked:
          type: string
          readOnly: true
        is_published:
          type: boolean
        is_featured:
          type: boolean
      required:
