# User website hosting: nginx serves *.ufazien.com from a shared webroot,
# php-fpm executes any PHP inside it.
#
# Deployed as a Coolify "Docker Compose" resource (base directory /hosting).
# Notes on the Coolify-specific bits:
#   - no `ports:` — Traefik reaches nginx over the Docker network. Publishing a
#     host port here would collide with the proxy on :80.
#   - no `container_name:` — Coolify derives its own names; fixed ones break
#     redeploys.
#   - no custom network — Coolify attaches its proxy network so Traefik can see
#     nginx. The compose default network still gives nginx -> php name
#     resolution, which is what `fastcgi_pass php:9000` needs.
#   - the webroot is a host bind mount, not a named volume, because the Django
#     backend (a separate Coolify resource) also writes user sites into it.
#     Sharing a named volume across resources is not workable; a host path is.

services:
  hosting:
    # Built rather than using nginx:alpine directly, so hosting.conf ships in
    # the image. Coolify rewrites relative bind mounts to
    # /data/coolify/applications/<uuid>/..., not the git checkout, so mounting
    # ./nginx/hosting.conf silently resolves to a nonexistent path.
    build:
      context: ./nginx
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes:
      - /data/ufazien/hosting:/var/www/html
    expose:
      - "80"
    depends_on:
      - php
    labels:
      - "traefik.enable=true"
      # Wildcard catch-all. Traefik 3 rejects wildcards in Host(), so this must
      # be HostRegexp — and it cannot come from Coolify's FQDN field, which
      # generates a Host() rule. Hence custom labels + "Readonly labels" off.
      - "traefik.http.routers.ufazien-hosting.rule=HostRegexp(`^.+\\.ufazien\\.com$`)"
      - "traefik.http.routers.ufazien-hosting.entrypoints=http"
      # Lower than the main app so ufazien.com / api.ufazien.com win over the
      # wildcard. Those routers are priority 1 by default; anything >1 here
      # would swallow them.
      - "traefik.http.routers.ufazien-hosting.priority=2"
      - "traefik.http.services.ufazien-hosting.loadbalancer.server.port=80"
      #
      # HTTPS. certresolver must be `cloudflare` (DNS-01), not Coolify's default
      # `letsencrypt` (HTTP-01): Let's Encrypt will not issue a wildcard over
      # HTTP-01, and Traefik has no hostname list to work from with HostRegexp.
      # tls.domains is what tells it to request the wildcard explicitly.
      - "traefik.http.routers.ufazien-hosting-tls.rule=HostRegexp(`^.+\\.ufazien\\.com$`)"
      - "traefik.http.routers.ufazien-hosting-tls.entrypoints=https"
      - "traefik.http.routers.ufazien-hosting-tls.priority=2"
      - "traefik.http.routers.ufazien-hosting-tls.tls=true"
      - "traefik.http.routers.ufazien-hosting-tls.tls.certresolver=cloudflare"
      - "traefik.http.routers.ufazien-hosting-tls.tls.domains[0].main=ufazien.com"
      - "traefik.http.routers.ufazien-hosting-tls.tls.domains[0].sans=*.ufazien.com"
      # Reuse the service defined above rather than declaring a second one.
      - "traefik.http.routers.ufazien-hosting-tls.service=ufazien-hosting"

  php:
    build: .
    restart: unless-stopped
    volumes:
      - /data/ufazien/hosting:/var/www/html
    environment:
      PHP_FPM_PM_MAX_CHILDREN: "5"
    labels:
      - "traefik.enable=false"
