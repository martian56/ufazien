server {
    listen 80 default_server;

    server_name ~^(?<subdomain>.+)\.ufazien\.com$;

    root /var/www/html/$subdomain;
    index index.php index.html index.htm;

    location / {
        try_files $uri $uri/ /index.html =404;
    }

    # Deny every dotfile, not just .htaccess.
    #
    # Sites legitimately need a .env on disk (there is no way to set per-site
    # environment variables on a shared php-fpm pool), but nginx must never
    # serve it: /.env was returning live database credentials in plaintext.
    # Also covers .git/, which exposes full source history.
    #
    # Declared BEFORE the .php handler on purpose: nginx evaluates regex
    # locations in order and takes the first match, so this must win for paths
    # like /.hidden/x.php. PHP still reads these files from disk normally -
    # this only governs what nginx will serve over HTTP.
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # PHP scripts handling
    location ~ \.php$ {
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }

}
