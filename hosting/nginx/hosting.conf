# What the analytics page is built from.
#
# One JSON object per request, which the backend rolls into a day per site with
# `manage.py aggregate_access_logs`. Nothing tracked user traffic before this:
# the analytics table's only writer was a webhook nothing called, so the page
# fell back to invented figures.
#
# `escape=json` is what makes this safe to parse — a user agent or a URL can
# contain quotes and backslashes, and without it one crafted request would
# break every line after it.
#
# $host rather than $server_name: the server_name here is a regex, and it is
# the host that says which site the request was for.
log_format hosting_json escape=json
    '{"t":"$time_iso8601",'
    '"host":"$host",'
    '"method":"$request_method",'
    '"uri":"$request_uri",'
    '"status":$status,'
    '"bytes":$body_bytes_sent,'
    '"ip":"$remote_addr",'
    '"ref":"$http_referer",'
    '"ua":"$http_user_agent"}';

server {
    listen 80 default_server;

    server_name ~^(?<subdomain>.+)\.ufazien\.com$;

    # Outside the webroot on purpose. Under /var/www/html it would be served:
    # the vhost roots at /var/www/html/$subdomain, so a request to
    # logs.ufazien.com would hand out every visitor's address on the platform.
    access_log /var/log/hosting/access.log hosting_json;

    root /var/www/html/$subdomain;
    index index.php index.html index.htm;

    location / {
        try_files $uri $uri/ /index.html =404;
    }

    # A symlink is a way out of the site directory that `open_basedir` does not
    # cover, because nginx reads the file itself rather than going through PHP.
    # `if_not_owner` still allows a site's own internal links.
    disable_symlinks if_not_owner from=$document_root;

    # Deny every dotfile, not just .htaccess.
    #
    # Sites legitimately need a .env on disk (there is no way to set per-site
    # environment variables on a shared php-fpm pool), but nginx must never
    # serve it: /.env was returning live database credentials in plaintext.
    # Also covers .git/, which exposes full source history.
    #
    # Declared BEFORE the .php handler on purpose: nginx evaluates regex
    # locations in order and takes the first match, so this must win for paths
    # like /.hidden/x.php. PHP still reads these files from disk normally -
    # this only governs what nginx will serve over HTTP.
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # PHP scripts handling
    location ~ \.php$ {
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;

        # Each site can only read its own directory.
        #
        # Every site runs in one php-fpm pool, as one user, with the whole
        # webroot mounted — so without this a single uploaded .php file could
        # read every other site on the platform, including the `.env` files
        # this platform writes into them, which hold database passwords and
        # API keys.
        #
        # Set per request rather than in the pool, because the pool is shared:
        # `PHP_VALUE` is applied to the one script being run, and $subdomain is
        # already captured from the host by `server_name` above.
        #
        # `/tmp` has to be in the list. Sessions, uploaded-file handling and
        # `sys_get_temp_dir()` all live there, and a basedir without it breaks
        # any site that accepts a form.
        fastcgi_param PHP_VALUE "open_basedir=/var/www/html/$subdomain:/tmp";
    }

}
