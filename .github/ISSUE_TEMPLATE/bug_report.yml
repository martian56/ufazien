name: Bug report
description: Something isn't working
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting this. If it's a security problem, please don't file it here. See [SECURITY.md](https://github.com/martian56/ufazien/blob/main/SECURITY.md).

  - type: dropdown
    id: area
    attributes:
      label: Where is it?
      options:
        - Campus simulator
        - Community (groups, forums, chat)
        - Hosting (websites, databases, domains)
        - Blog
        - GPA calculator
        - Average calculator
        - Calendar
        - AI tools
        - Accounts, login, settings
        - Somewhere else / not sure
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what did you get instead?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: How do we reproduce it?
      placeholder: |
        1. Go to ...
        2. Click ...
        3. See ...
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or console output
      description: Optional, but very helpful for anything visual. Drag images straight in.

  - type: input
    id: environment
    attributes:
      label: Browser and device
      placeholder: Chrome 130 on Windows 11, or Safari on iPhone 15

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and this isn't a duplicate
          required: true
        - label: This is not a security vulnerability (those go to SECURITY.md)
          required: true
